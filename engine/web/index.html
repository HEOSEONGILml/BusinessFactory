<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BusinessFactory</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #f3f4f7; --panel: #ffffff; --line: #e1e4ea; --line-strong: #cfd4dd;
  --text: #161b26; --muted: #454e5f; --faint: #6b7487;
  --accent: #3451d1; --accent-soft: #e8ecff;
  --ok: #23863a; --ok-soft: #e3f4e7; --warn: #b8650a; --warn-soft: #fff1dc;
  --bad: #c92a2a; --bad-soft: #ffe6e6; --info: #1864ab; --info-soft: #e2f0fd; --idle: #5c6575; --idle-soft: #eceef2;
  --floor: #ece6dc; --desk: #c99e6e; --desk-top: #d9b38a; --screen-off: #3a3f4a; --screen-on: #0f2a1d;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 6px rgba(16,24,40,.06);
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  --sans: "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111419; --panel: #191d24; --line: #2b313c; --line-strong: #3a4250;
    --text: #eef1f6; --muted: #c3cad6; --faint: #98a1b2;
    --accent: #8da2ff; --accent-soft: #252e4d;
    --ok: #63d47a; --ok-soft: #1b3424; --warn: #ffb35c; --warn-soft: #3b2b14;
    --bad: #ff7b7b; --bad-soft: #3f1e20; --info: #6cb8ff; --info-soft: #172d44; --idle: #aab2bf; --idle-soft: #272c35;
    --floor: #23211e; --desk: #6e5238; --desk-top: #85644a; --screen-off: #2a2e36; --screen-on: #0b2618;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.65 var(--sans); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ---------- header ---------- */
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 18px; padding: 12px 24px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -.3px; }
.brand small { color: var(--faint); font-weight: 500; font-size: 14px; margin-left: 6px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.ok::before { animation: pulse 1.6s infinite; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--idle-soft); color: var(--idle); }
@keyframes pulse { 50% { opacity: .35; } }
.meters { display: flex; gap: 22px; margin-left: auto; flex-wrap: wrap; }
.meter { min-width: 210px; font-size: 14px; color: var(--muted); }
.meter .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.meter b { color: var(--text); font-size: 15px; }
.meter small { color: var(--faint); font-size: 12.5px; }
.meter .bar { height: 7px; border-radius: 4px; background: var(--idle-soft); overflow: hidden; margin-top: 4px; }
.meter .bar i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.meter.mid .bar i { background: var(--warn); } .meter.high .bar i { background: var(--bad); }

main { padding: 20px 24px 48px; max-width: 1760px; margin: 0 auto; }
.composer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 20px; }
.composer textarea { width: 100%; min-height: 52px; resize: vertical; border: none; outline: none; background: transparent; font-size: 16px; line-height: 1.6; }
.composer textarea::placeholder { color: var(--faint); }
.composer .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; }
.composer label { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; font-weight: 600; }
.composer select, .composer input { border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; background: var(--bg); font-size: 14px; }
.hint { color: var(--faint); font-size: 13px; }

/* ---------- panels ---------- */
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.panel > h2 { margin: 0; font-size: 16px; font-weight: 800; padding: 13px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; letter-spacing: -.2px; }
.panel > h2 .count { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 9px; font-size: 13px; line-height: 22px; }
.panel > h2 .spacer { flex: 1; }
.panel > h2 .sub { color: var(--faint); font-weight: 500; font-size: 13.5px; }
.panel-body { padding: 16px 18px; }
.empty { color: var(--faint); text-align: center; padding: 24px 0; font-size: 15px; }
.stack > * + * { margin-top: 14px; }

.grid { display: grid; grid-template-columns: minmax(340px, 1fr) minmax(420px, 1.35fr) minmax(360px, 1.1fr); gap: 20px; align-items: start; margin-top: 20px; }
@media (max-width: 1280px) { .grid { grid-template-columns: 1fr 1fr; } .feed-col { grid-column: 1 / -1; } }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } header, main { padding-left: 14px; padding-right: 14px; } .meters { margin-left: 0; } }

/* ---------- office ---------- */
.office { background:
    linear-gradient(var(--floor), var(--floor)) padding-box;
  padding: 22px 20px 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 26px 20px; }
.desk { position: relative; cursor: default; }
.desk.clickable { cursor: pointer; }
.desk .screen { position: relative; margin: 0 auto; width: 88%; height: 112px; border-radius: 10px 10px 4px 4px; background: var(--screen-off);
  border: 6px solid #2b2f36; padding: 10px 12px; color: #9ff2bf; font: 13px/1.5 var(--sans); overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,.18); }
.desk.working .screen, .desk.reviewing .screen { background: var(--screen-on); }
.desk .screen .task { color: #fff; font-weight: 700; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.desk .screen .now { margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.desk .screen .off { color: #8b93a3; display: flex; height: 100%; align-items: center; justify-content: center; font-size: 15px; gap: 6px; }
.desk .screen .cursor { display: inline-block; width: 7px; height: 14px; background: #9ff2bf; vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.desk .stand { width: 26px; height: 12px; background: #2b2f36; margin: 0 auto; }
.desk .table { position: relative; height: 18px; border-radius: 6px; background: var(--desk-top); border-bottom: 8px solid var(--desk); box-shadow: 0 6px 10px rgba(0,0,0,.12); }
.desk .keyboard { position: absolute; left: 50%; top: 3px; transform: translateX(-50%); width: 70px; height: 9px; border-radius: 3px; background: #e9ebef; }
.desk.working .keyboard, .desk.reviewing .keyboard { animation: type .35s infinite alternate; }
@keyframes type { to { background: #cfd4dc; } }
.desk .mug { position: absolute; right: 16px; top: -12px; font-size: 18px; }
.desk .person { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 0 4px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; flex: none; border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--line-strong); }
.desk.working .avatar { box-shadow: 0 0 0 3px var(--ok); }
.desk.reviewing .avatar { box-shadow: 0 0 0 3px var(--accent); }
.person .name { font-weight: 800; font-size: 16px; line-height: 1.3; }
.person .role { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; padding: 0 4px; }
.badge { font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line-strong); color: var(--muted); }
.badge.live { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.badge.rev { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.badge.queue { background: var(--warn-soft); border-color: transparent; color: var(--warn); }

/* ---------- inbox cards ---------- */
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--panel); }
.card.approval { border-left: 4px solid var(--warn); } .card.mine { border-left: 4px solid var(--accent); } .card.mine .kind { color: var(--accent); } .card.question { border-left: 4px solid var(--info); } .card.finished { border-left: 4px solid var(--ok); }
.card .kind { font-size: 13px; font-weight: 800; }
.card.approval .kind { color: var(--warn); } .card.question .kind { color: var(--info); } .card.finished .kind { color: var(--ok); }
.card .kind span { color: var(--faint); font-weight: 600; }
.card .title { font-weight: 700; font-size: 16px; line-height: 1.5; margin: 4px 0 8px; }
.card .meta { color: var(--muted); font-size: 14px; }
.card .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.card textarea, .notebox { width: 100%; min-height: 70px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; background: var(--bg); resize: vertical; font-size: 14.5px; line-height: 1.6; margin-top: 10px; }
.grant { display: inline-block; font-family: var(--mono); font-size: 13px; background: var(--warn-soft); color: var(--warn); border-radius: 5px; padding: 2px 8px; margin: 3px 6px 3px 0; font-weight: 600; }
details.hire { margin-top: 10px; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px; }
details.hire summary { cursor: pointer; font-weight: 700; }

.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 7px 16px; cursor: pointer; font-weight: 700; font-size: 14.5px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.good { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 11px; font-size: 13.5px; }

.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.s-running { background: var(--info-soft); color: var(--info); }
.s-pending, .s-waiting { background: var(--idle-soft); color: var(--idle); }
.s-review { background: var(--accent-soft); color: var(--accent); }
.s-blocked { background: var(--warn-soft); color: var(--warn); }
.s-done { background: var(--ok-soft); color: var(--ok); }
.s-failed { background: var(--bad-soft); color: var(--bad); }
.s-canceled, .s-awaiting_approval { background: var(--idle-soft); color: var(--faint); }

/* ---------- board ---------- */
.goal { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.goal + .goal { margin-top: 14px; }
.goal-head { padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; }
.goal-head:hover, .trow:hover { background: var(--bg); }
.goal-head .title { font-weight: 700; font-size: 16px; line-height: 1.45; }
.goal-head > .chip, .trow > .chip { align-self: start; justify-self: end; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.tags span { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; }
.trow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; font-size: 15px; line-height: 1.5; }
.id { font-family: var(--mono); font-size: 12.5px; color: var(--faint); padding-top: 2px; }
.trow .who { color: var(--muted); font-size: 13.5px; }
.live { grid-column: 1 / -1; font-size: 13.5px; color: var(--info); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.live::before { content: "▶ "; font-size: 10px; vertical-align: 1px; }

/* ---------- feed ---------- */
.feed { font-size: 14px; line-height: 1.6; height: calc(100vh - 220px); min-height: 360px; overflow-y: auto; padding: 6px 0; }
.feed .row { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 5px 16px; }
.feed .row:hover { background: var(--bg); }
.feed .t { font-family: var(--mono); font-size: 12px; color: var(--faint); padding-top: 2px; }
.feed .msg { min-width: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.feed .row.open .msg { -webkit-line-clamp: unset; }
.feed .who { font-weight: 700; color: var(--text); margin-right: 6px; }
.feed .act .msg { color: var(--muted); -webkit-line-clamp: 2; }
.feed .start { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 9px; }
.feed .start .msg { color: var(--accent); font-weight: 700; }
.feed .alert .msg { color: var(--bad); font-weight: 700; }
.feed .note .msg { color: var(--ok); font-weight: 600; }
.feed code { font-family: var(--mono); font-size: 12.5px; background: var(--bg); padding: 0 4px; border-radius: 4px; }
.tid { cursor: pointer; font-family: var(--mono); font-size: 12.5px; color: var(--accent); font-weight: 700; margin-right: 6px; }

.side-list { font-size: 14px; }
.side-list .item { padding: 7px 0; border-bottom: 1px solid var(--line); }
.side-list .item:last-child { border-bottom: none; }
.side-list b { font-weight: 700; }
.side-list .d { color: var(--muted); font-size: 13.5px; }
.side-h { margin: 18px 0 4px; font-size: 14px; color: var(--muted); font-weight: 800; }
.side-h:first-child { margin-top: 0; }

/* ---------- dialog ---------- */
dialog { border: none; border-radius: 14px; padding: 0; width: min(980px, 95vw); max-height: 92vh; background: var(--panel); color: var(--text); box-shadow: 0 24px 70px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,14,22,.55); }
.dlg-head { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.dlg-head h3 { margin: 0; font-size: 19px; line-height: 1.45; flex: 1; letter-spacing: -.2px; }
.dlg-body { padding: 16px 22px 24px; overflow-y: auto; max-height: calc(92vh - 70px); }
.dlg-body h4 { margin: 20px 0 8px; font-size: 14.5px; color: var(--muted); font-weight: 800; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 16px 0 14px; }
.tabs button { border: none; background: none; padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 700; font-size: 15px; }
.tabs button.on { color: var(--accent); border-color: var(--accent); }
.loglist .entry { padding: 10px 0; border-bottom: 1px solid var(--line); }
.loglist .entry .h { font-size: 13.5px; color: var(--muted); margin-bottom: 2px; }
.loglist .entry .h b { color: var(--text); }
.loglist .entry.by-owner { border-left: 3px solid var(--info); padding-left: 10px; }
.loglist .entry.by-engine { opacity: .7; }
.loglist .entry .h a.id { text-decoration: none; }
.loglist .prose.clamp { max-height: 15em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.loglist .more { margin-top: 4px; }
.logopts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.logopts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.files { display: flex; gap: 8px; flex-wrap: wrap; }
.actfeed { font-size: 14px; }
.actfeed div { padding: 3px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }

.prose { font-size: 15.5px; line-height: 1.8; max-width: 78ch; }
.prose h1, .prose h2, .prose h3 { margin: 22px 0 8px; line-height: 1.4; letter-spacing: -.2px; }
.prose h1 { font-size: 21px; } .prose h2 { font-size: 18px; } .prose h3 { font-size: 16.5px; }
.prose p { margin: 8px 0; }
.prose code { font-family: var(--mono); font-size: 13.5px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.prose pre { background: var(--bg); padding: 12px 14px; border-radius: 8px; font: 13.5px/1.6 var(--mono); white-space: pre-wrap; }
.prose table { border-collapse: collapse; margin: 12px 0; font-size: 14.5px; display: block; overflow-x: auto; }
.prose th, .prose td { border: 1px solid var(--line-strong); padding: 7px 11px; text-align: left; vertical-align: top; }
.prose th { background: var(--bg); }
.prose blockquote { margin: 10px 0; padding: 4px 14px; border-left: 4px solid var(--line-strong); color: var(--muted); }
.prose ul, .prose ol { padding-left: 24px; margin: 8px 0; }
.prose li { margin: 3px 0; }
.card .prose { font-size: 15px; line-height: 1.7; }

/* ---------- image attachments ---------- */
.attach { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.attach .thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.attach .thumbs:empty { display: none; }
.thumb { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-strong); background: var(--bg); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.loading { display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.thumb button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; font-size: 13px; line-height: 20px; padding: 0; }
.card .attach { margin-top: 8px; }
/* ---------- inbox comment threads ---------- */
.thread { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.cmt { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--bg); }
.cmt.me { border-left: 3px solid var(--info); }
.cmt .h { font-size: 12.5px; color: var(--faint); margin-bottom: 2px; }
.cmt .h b { color: var(--muted); }
.thread .mark { font-size: 12.5px; color: var(--faint); text-align: center; padding: 2px 0; border-top: 1px dashed var(--line); }
.cmt.typing { color: var(--muted); font-size: 13.5px; border-style: dashed; }
.card .hint { color: var(--faint); font-size: 12.5px; }
.drop-on { outline: 2px dashed var(--accent); outline-offset: 4px; }
.att { display: inline-block; margin: 4px 6px 4px 0; vertical-align: top; }
.att img { max-width: min(320px, 100%); max-height: 240px; border-radius: 8px; border: 1px solid var(--line); display: block; }
.out-img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }

/* ---------- engine switch ---------- */
.engine-ctl { display: flex; gap: 8px; align-items: center; }

/* ---------- staff editor ---------- */
.staff { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
@media (max-width: 900px) { .staff { grid-template-columns: 1fr; } }
.staff-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.staff-item:hover { background: var(--bg); }
.staff-item.on { background: var(--accent-soft); }
.staff-item .avatar { width: 40px; height: 40px; font-size: 20px; border-width: 2px; }
.form-row { margin-bottom: 16px; }
.form-row > label { display: block; font-weight: 800; font-size: 14.5px; margin-bottom: 6px; }
.form-row .hint { display: block; margin-top: 4px; }
.toolpick { display: flex; flex-wrap: wrap; gap: 8px; }
.toolpick label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; padding: 5px 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
.toolpick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
textarea.field.mono { font-family: var(--mono); font-size: 13.5px; }

/* ---------- top tabs ---------- */
nav.views { display: flex; gap: 4px; }
nav.views button { border: none; background: none; padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; }
nav.views button.on { background: var(--accent-soft); color: var(--accent); }

/* ---------- office: talking ---------- */
.desk.talking .screen { background: #1c2244; color: #c9d1ff; }
.desk.talking .screen .cursor { background: #c9d1ff; }
.desk.talking .avatar { box-shadow: 0 0 0 3px #7c8cff; }
.badge.talk { background: #ebe8ff; border-color: transparent; color: #5546d6; }

/* ---------- messenger ---------- */
.chat { display: grid; grid-template-columns: 300px 1fr; gap: 20px; height: calc(100vh - 104px); min-height: 520px; }
.chat > section { display: flex; flex-direction: column; min-height: 0; }
.chat-side .panel-body { overflow-y: auto; padding: 10px; }
.group-h { font-size: 13.5px; font-weight: 800; color: var(--muted); padding: 12px 10px 6px; display: flex; align-items: center; }
.group-h button { margin-left: auto; }
.conv-item { display: flex; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; align-items: center; }
.conv-item:hover { background: var(--bg); }
.conv-item.on { background: var(--accent-soft); }
.conv-item .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; flex: none; background: var(--bg); }
.conv-item .t { font-weight: 700; font-size: 15px; line-height: 1.3; }
.conv-item .p { color: var(--faint); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.conv-item .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-left: auto; flex: none; animation: pulse 1.2s infinite; }
.chat-head { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.chat-head h3 { margin: 0; font-size: 18px; letter-spacing: -.2px; }
.chat-head .agenda { width: 100%; color: var(--muted); font-size: 14px; }
.people { display: flex; gap: 6px; flex-wrap: wrap; }
.person-chip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 10px 2px 3px; border-radius: 999px; border: 1px solid var(--line); font-size: 13.5px; font-weight: 700; }
.person-chip .mini { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; }
.person-chip.speaking { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.person-chip.next { border-style: dashed; }
.msgs { flex: 1; overflow-y: auto; padding: 14px 22px; }
.cmsg { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 9px 0; }
.cmsg .avatar { width: 40px; height: 40px; font-size: 20px; border-width: 2px; }
.cmsg .who { font-weight: 800; font-size: 15px; }
.cmsg .when { color: var(--faint); font-size: 12.5px; margin-left: 6px; font-weight: 500; }
.cmsg .body { margin-top: 2px; }
.cmsg .body p:first-child { margin-top: 0; }
.cmsg.summary .body { background: var(--ok-soft); border-radius: 10px; padding: 12px 16px; margin-top: 6px; }
.cmsg.system .body { color: var(--faint); }
.day { text-align: center; color: var(--faint); font-size: 12.5px; margin: 10px 0; }
.typing { padding: 9px 22px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); min-height: 40px; }
.typing b { color: var(--text); }
.typing .dots::after { content: "…"; animation: pulse 1s infinite; }
.chat-compose { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; }
.chat-compose { flex-wrap: wrap; }
.chat-compose textarea { flex: 1; min-height: 48px; max-height: 220px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 13px; background: var(--bg); font-size: 15px; line-height: 1.55; }
.chat-empty { flex: 1; display: grid; place-items: center; color: var(--faint); text-align: center; padding: 30px; }
@media (max-width: 900px) { .chat { grid-template-columns: 1fr; height: auto; } .msgs { max-height: 60vh; } }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.pick label { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.field { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; background: var(--bg); font-size: 15px; }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
#toast.show { opacity: 1; } #toast.err { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<header>
  <div class="brand">BusinessFactory<small id="company"></small></div>
  <div class="engine-ctl"><span id="engine" class="pill idle">확인 중</span><button class="btn small" id="engineBtn" hidden></button></div>
  <nav class="views"><button data-view="dash" class="on">대시보드</button><button data-view="chat">메신저</button><button data-view="staff">직원</button></nav>
  <div class="meters" id="meters"></div>
</header>

<main>
 <div id="viewDash">
  <div class="composer">
    <textarea id="goalText" placeholder="회사에 시킬 일을 적으세요. 예) 돈 벌 수 있는 웹 서비스 아이디어 10개를 조사해서 순위를 매겨줘"></textarea>
    <div class="row">
      <label>작업 공간 <select id="goalWorkspace"><option value="">없음</option></select></label>
      <label>프로젝트 <input id="goalProject" list="projects" placeholder="선택 사항" size="12"></label>
      <datalist id="projects"></datalist>
      <span id="goalAttach"></span>
      <span style="flex:1"></span>
      <span class="hint">Ctrl+Enter</span>
      <button class="btn primary" id="goalSubmit">목표 등록</button>
    </div>
  </div>

  <section class="panel">
    <h2>사무실 <span class="sub" id="officeSummary"></span></h2>
    <div class="office" id="office"></div>
  </section>

  <div class="grid">
    <div class="stack">
      <section class="panel">
        <h2>처리할 일 <span class="count" id="inboxCount" hidden></span></h2>
        <div class="panel-body stack" id="inbox"></div>
      </section>
      <section class="panel">
        <h2>회사</h2>
        <div class="panel-body">
          <div class="side-h">회사 기억</div><div class="side-list" id="memory"></div>
          <div class="side-h">최근 7일 실행</div><div class="side-list" id="runs"></div>
        </div>
      </section>
    </div>

    <section class="panel">
      <h2>업무 현황 <span class="spacer"></span>
        <label style="font-weight:600;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center"><input type="checkbox" id="showDone"> 끝난 목표도 보기</label>
      </h2>
      <div class="panel-body" id="board"></div>
    </section>

    <section class="panel feed-col">
      <h2>실시간 활동 <span class="spacer"></span><span id="feedState" class="sub"></span></h2>
      <div class="feed" id="feed"></div>
    </section>
  </div>
 </div>

 <div id="viewStaff" hidden>
  <div class="staff">
    <section class="panel">
      <h2>직원 <span class="spacer"></span><button class="btn small primary" id="staffNew">+ 새 직원</button></h2>
      <div class="panel-body" id="staffList" style="padding:8px"></div>
    </section>
    <section class="panel">
      <h2 id="staffTitle">직원을 고르세요</h2>
      <div class="panel-body" id="staffForm"></div>
    </section>
  </div>
 </div>

 <div id="viewChat" hidden>
  <div class="chat">
    <section class="panel chat-side">
      <h2>메신저 <span class="spacer"></span><button class="btn primary small" id="meetBtn">🗣 회의하기</button></h2>
      <div class="panel-body" id="convList"></div>
    </section>
    <section class="panel" id="chatMain">
      <div class="chat-empty">왼쪽에서 채널이나 직원을 고르거나,<br>회의하기로 회의를 여세요.</div>
    </section>

 </div>
</main>

<dialog id="meetDlg">
  <div class="dlg-head"><h3>회의하기</h3><button class="btn small" onclick="meetDlg.close()">닫기</button></div>
  <div class="dlg-body">
    <h4 style="margin-top:0">회의 제목</h4>
    <input id="meetTitle" class="field" placeholder="예) 다음 달 BlindCandle 우선순위">
    <h4>안건 (무엇을 논의할지)</h4>
    <textarea id="meetAgenda" class="field" style="min-height:110px" placeholder="예) 토스 미니앱 출시와 주식 섹션 중 무엇을 먼저 할지, 각자 근거를 들어 의견을 주세요."></textarea>
    <h4>참석자</h4>
    <div class="pick" id="meetPeople"></div>
    <p class="hint">참석자가 한 명씩 차례로 발언합니다. 발언 하나가 실행 한 번이라 사용량이 듭니다.</p>
    <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn primary" id="meetStart">회의 시작</button></div>
  </div>
</dialog>

<dialog id="dlg">

  <div class="dlg-body" id="dlgBody"></div>
</dialog>
<div id="toast"></div>

<script>
const TOKEN = '%%TOKEN%%';
let state = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const terminal = (s) => ['done', 'failed', 'canceled'].includes(s);
const ago = (iso) => {
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `${s}초` : s < 3600 ? `${Math.round(s / 60)}분` : `${Math.round(s / 3600)}시간`;
};

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.className = ''), 2800);
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-BF-Token': TOKEN }, body: JSON.stringify(body),
  });
  if (res.status === 401) { location.href = '/login'; throw new Error('로그인이 필요합니다.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청 실패');
  return data;
}

async function act(id, action, body, okMsg) {
  try { await api(`/api/task/${id}/${action}`, body); toast(okMsg); await refresh(); }
  catch (e) { toast(e.message, true); }
}

/* ---------- image attachments ---------- */
// Pending images per input box ('goal', 'q:<id>:<item>', 'c:<conv>'); kept across re-renders.
const attachments = new Map();
const ATTACH_LABEL = '📎 첨부 이미지 (직원은 Read 도구로 파일을 열어 볼 것)';
function attachUI(key) {
  const list = attachments.get(key) ?? [];
  const thumbs = list.map((a, i) => a.path
    ? `<span class="thumb"><img src="/api/attachment?path=${encodeURIComponent(a.path)}" alt=""><button type="button" data-unattach="${i}" title="빼기">×</button></span>`
    : '<span class="thumb loading">올리는 중</span>').join('');
  return `<div class="attach" data-attach="${esc(key)}"><button type="button" class="btn small" data-pick title="이미지 첨부 (붙여 넣기, 끌어다 놓기도 됩니다)">📎 이미지</button>
    <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden><span class="thumbs">${thumbs}</span></div>`;
}
function redrawAttach(key) {
  document.querySelectorAll('[data-attach]').forEach((el) => { if (el.dataset.attach === key) el.outerHTML = attachUI(key); });
}
const uploading = (key) => (attachments.get(key) ?? []).some((a) => !a.path);
function withAttachments(text, key) {
  const done = (attachments.get(key) ?? []).filter((a) => a.path);
  if (!done.length) return text;
  return `${text ? text + '\n\n' : ''}${ATTACH_LABEL}\n${done.map((a) => `![${a.name.replace(/[[\]()]/g, '')}](${a.path})`).join('\n')}`;
}
function clearAttachments(key) { attachments.delete(key); redrawAttach(key); }
async function addImages(key, files) {
  const list = attachments.get(key) ?? [];
  attachments.set(key, list);
  for (const file of files) {
    if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) { toast(`${file.name}: PNG, JPG, GIF, WEBP 만 올릴 수 있습니다`, true); continue; }
    if (file.size > 10 * 1024 * 1024) { toast(`${file.name}: 10MB 까지 올릴 수 있습니다`, true); continue; }
    const entry = { name: file.name || 'image', path: null };
    list.push(entry); redrawAttach(key);
    try {
      const res = await fetch('/api/upload', { method: 'POST', headers: { 'X-BF-Token': TOKEN, 'Content-Type': file.type }, body: file });
      if (res.status === 401) { location.href = '/login'; return; }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '올리기 실패');
      entry.path = data.path;
    } catch (e) {
      list.splice(list.indexOf(entry), 1); toast(e.message, true);
    }
    redrawAttach(key);
  }
}
// The attach box that belongs to wherever the event happened (goal composer, question card, chat).
function attachKeyFor(el) {
  const scope = el.closest('.composer, .card, .chat-compose');
  return scope?.querySelector('[data-attach]')?.dataset.attach ?? null;
}
document.addEventListener('click', (ev) => {
  const pick = ev.target.closest('[data-pick]');
  if (pick) return pick.parentElement.querySelector('input[type=file]').click();
  const un = ev.target.closest('[data-unattach]');
  if (un) { const key = un.closest('[data-attach]').dataset.attach; attachments.get(key)?.splice(Number(un.dataset.unattach), 1); redrawAttach(key); }
});
document.addEventListener('change', (ev) => {
  const box = ev.target.closest?.('[data-attach]');
  if (box && ev.target.type === 'file') addImages(box.dataset.attach, [...ev.target.files]);
});
document.addEventListener('paste', (ev) => {
  const key = ev.target instanceof Element ? attachKeyFor(ev.target) : null;
  const files = [...(ev.clipboardData?.files ?? [])].filter((f) => f.type.startsWith('image/'));
  if (key && files.length) { ev.preventDefault(); addImages(key, files); }
});
for (const type of ['dragover', 'dragleave', 'drop']) {
  document.addEventListener(type, (ev) => {
    const key = ev.target instanceof Element ? attachKeyFor(ev.target) : null;
    if (!key || !ev.dataTransfer?.types.includes('Files')) return;
    ev.preventDefault();
    const scope = ev.target.closest('.composer, .card, .chat-compose');
    scope.classList.toggle('drop-on', type === 'dragover');
    if (type === 'drop') addImages(key, [...ev.dataTransfer.files]);
  });
}
$('#goalAttach').outerHTML = attachUI('goal');

/* ---------- tiny markdown ---------- */
function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/!\[([^\]]*)\]\(([^)\n]*[\\/]attachments[\\/][^)\n]+)\)/g, (_, alt, p) => {
      const src = `/api/attachment?path=${encodeURIComponent(p.replace(/&amp;/g, '&'))}`;
      return `<a class="att" href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${alt}" loading="lazy"></a>`;
    })
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(src) {
  const lines = String(src ?? '').replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let b = ''; i++; while (i < lines.length && !/^```/.test(lines[i])) b += lines[i++] + '\n'; i++; out += `<pre>${esc(b)}</pre>`; continue; }
    const h = /^(#{1,4})\s+(.*)$/.exec(l); if (h) { const n = Math.min(h[1].length, 3); out += `<h${n}>${inlineMd(h[2])}</h${n}>`; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r));
      out += '<table>' + body.map((r, k) => '<tr>' + cells(r).map((c) => k === 0 ? `<th>${inlineMd(c)}</th>` : `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') + '</table>';
      continue;
    }
    if (/^>\s?/.test(l)) { const b = []; while (i < lines.length && /^>\s?/.test(lines[i])) b.push(lines[i++].replace(/^>\s?/, '')); out += `<blockquote>${inlineMd(b.join(' '))}</blockquote>`; continue; }
    if (/^\s*[-*]\s+/.test(l)) { let b = ''; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) b += `<li>${inlineMd(lines[i++].replace(/^\s*[-*]\s+/, ''))}</li>`; out += `<ul>${b}</ul>`; continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { let b = ''; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) b += `<li>${inlineMd(lines[i++].replace(/^\s*\d+[.)]\s+/, ''))}</li>`; out += `<ol>${b}</ol>`; continue; }
    if (!l.trim()) { i++; continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\||>|\s*[-*]\s|\s*\d+[.)]\s)/.test(lines[i])) p.push(lines[i++]);
    out += `<p>${p.map(inlineMd).join('<br>')}</p>`;
  }
  return out;
}
/**
 * Employees often pass a whole request as one shell argument with no line breaks
 * ("... 이유: ... 순서: 1) ... 2) ... 답변에 적을 것: ..."). Give such one-liners back their
 * structure: labels become bold headings, inline steps become a list. Text that already
 * has line breaks is left as written.
 */
function tidy(src) {
  const s = String(src ?? '').trim();
  if (s.includes('\n') || s.length < 120) return s;
  return s
    .replace(/\s+(이유|순서|방법|할 일|비용|기한|주의|참고|답변에 적을 것|답변 방법)\s*:\s*/g, '\n\n**$1**\n')
    .replace(/(^|\s)(\d{1,2})\)\s+/g, '\n$2. ')
    .replace(/\s*([①-⑳])\s*/g, '\n- $1 ');
}

/* ---------- header ---------- */
function renderHeader() {
  $('#company').textContent = state.company ? `· ${state.company}` : '';
  const e = state.engine, el = $('#engine'), btn = $('#engineBtn');
  const busy = (e.active ?? []).length;
  let action = null;
  if (!e.running) { el.className = 'pill idle'; el.textContent = '엔진 꺼짐'; el.title = 'npm start 로 켜세요'; }
  else if (e.halted) { el.className = 'pill bad'; el.textContent = '엔진 멈춤 — 확인 필요'; el.title = e.halted; action = ['start', '확인했음, 다시 가동']; }
  else if (e.enabled === false && e.stopping) { el.className = 'pill warn'; el.textContent = `정지 중 · 마무리 ${busy}건`; el.title = ''; action = ['start', '▶ 다시 가동']; }
  else if (e.enabled === false) { el.className = 'pill idle'; el.textContent = '엔진 꺼짐'; el.title = '직원들이 쉬고 있습니다'; action = ['start', '▶ 엔진 가동']; }
  else if (e.pausedUntil) { el.className = 'pill warn'; el.textContent = `휴식 중 · ${new Date(e.pausedUntil).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}까지`; el.title = '사용량 한도'; action = ['stop', '⏸ 엔진 정지']; }
  else { el.className = 'pill ok'; el.textContent = '가동 중'; el.title = ''; action = ['stop', '⏸ 엔진 정지']; }
  btn.hidden = !action;
  if (action) { btn.textContent = action[1]; btn.dataset.do = action[0]; btn.className = 'btn small' + (action[0] === 'start' ? ' good' : ''); }

  const labels = { five_hour: '5시간 한도', seven_day: '주간 한도' };
  const w = state.usage?.windows ?? {};
  $('#meters').innerHTML = Object.keys(w).length ? Object.entries(w).map(([k, v]) => {
    const pct = Math.round(v.utilization * 100);
    const cls = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : '';
    const reset = new Date(v.resetsAt * 1000).toLocaleString([], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return `<div class="meter ${cls}"><div class="top"><span>${labels[k] ?? k} <b>${pct}%</b></span><small>${reset} 리셋</small></div>
      <div class="bar"><i style="width:${Math.min(pct, 100)}%"></i></div></div>`;
  }).join('') : '<div class="meter">구독 사용량은 직원이 한 번 일하면 표시됩니다</div>';
}

/* ---------- office ---------- */
const AVATARS = { ceo: ['👔', '#ffe8cc'], hr: ['📁', '#e5dbff'], reviewer: ['🔍', '#d0ebff'], worker: ['🔧', '#d3f9d8'] };
const PALETTE = ['#ffe3e3', '#fff3bf', '#d3f9d8', '#d0ebff', '#e5dbff', '#ffdeeb', '#c3fae8', '#ffe8cc'];
// Single-codepoint emoji only: ZWJ sequences (🧑‍💻) split into two glyphs on some Windows setups.
const EMOJI = ['💼', '📊', '🧩', '📝', '🎯', '📦', '🧪', '🗃️'];
function avatarOf(name) {
  if (AVATARS[name]) return AVATARS[name];
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return [/dev|engineer|coder/.test(name) ? '💻' : /design/.test(name) ? '🎨' : /market/.test(name) ? '📣' : /writ|content/.test(name) ? '✍️' : /research|analy/.test(name) ? '📚' : EMOJI[h % EMOJI.length], PALETTE[h % PALETTE.length]];
}

// Comments on an inbox item. Talking only: answering, approving and acknowledging stay separate buttons.
function threadUI(x) {
  const when = (iso) => new Date(iso).toLocaleString([], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const items = x.thread.map((e) => {
    const me = e.from === state.owner;
    return `<div class="cmt${me ? ' me' : ''}"><div class="h"><b>${me ? '나' : esc(e.from)}</b> · ${when(e.at)}</div><div class="prose">${md(tidy(e.text))}</div></div>`;
  });
  if (x.thread.at(-1)?.from === state.owner) {
    items.push(`<div class="cmt typing">💬 ${esc(x.assignee)} ${x.replying ? '이(가) 코멘트를 쓰고 있습니다…' : '이(가) 곧 확인합니다 (엔진이 켜져 있어야 합니다)'}</div>`);
  }
  const earlier = x.earlier?.length ? `<details class="hire"><summary>이전 코멘트 ${x.earlier.filter((e) => !e.event).length}건</summary>${threadHistory(x.earlier)}</details>` : '';
  return earlier + (items.length ? `<div class="thread">${items.join('')}</div>` : '');
}
async function postComment(card) {
  const id = card.dataset.id, item = card.dataset.item ? Number(card.dataset.item) : null;
  const key = `i:${id}:${card.dataset.item ?? ''}`, ta = card.querySelector('textarea');
  if (uploading(key)) return toast('이미지를 올리는 중입니다', true);
  const full = withAttachments(ta.value.trim(), key);
  if (!full) return toast('코멘트를 적어 주세요', true);
  try { await api(`/api/task/${id}/thread`, { text: full, item }); }
  catch (e) { return toast(e.message, true); }
  ta.value = ''; clearAttachments(key);
  await refresh();
}

  const box = $('#inbox');
  if (box.dataset.html === h) return;
  const keyOf = (card) => `${card.className}|${card.dataset.id}|${card.dataset.item ?? ''}`;
  const drafts = new Map(), opened = new Set();
  let focus = null;
  box.querySelectorAll('.card').forEach((card) => {
    const ta = card.querySelector('textarea');
    if (ta?.value) drafts.set(keyOf(card), ta.value);
    if (ta && ta === document.activeElement) focus = { key: keyOf(card), start: ta.selectionStart, end: ta.selectionEnd, dir: ta.selectionDirection, scroll: ta.scrollTop };
    card.querySelectorAll('details').forEach((d, i) => { if (d.open) opened.add(`${keyOf(card)}#${i}`); });
  });
  box.innerHTML = h; box.dataset.html = h;
  box.querySelectorAll('.card').forEach((card) => {
    const ta = card.querySelector('textarea'), k = keyOf(card);
    if (ta && drafts.has(k)) ta.value = drafts.get(k);
    card.querySelectorAll('details').forEach((d, i) => { if (opened.has(`${k}#${i}`)) d.open = true; });
    if (ta && focus?.key === k) { ta.focus({ preventScroll: true }); ta.setSelectionRange(focus.start, focus.end, focus.dir); ta.scrollTop = focus.scroll; }
  });
}

$('#inbox').addEventListener('click', (ev) => {
  const b = ev.target.closest('button, a[data-open]'); if (!b) return;
  const card = b.closest('.card'), id = card?.dataset.id;
  if (b.dataset.open) { ev.preventDefault(); return openTask(b.dataset.open); }
  const text = card.querySelector('textarea')?.value.trim() ?? '';
  if (b.dataset.act === 'approve') act(id, 'approve', { note: text }, '승인했습니다');
  if (b.dataset.act === 'deny') { if (!text) return toast('반려 사유를 적어 주세요', true); act(id, 'deny', { reason: text }, '반려했습니다'); }
  if (b.dataset.act === 'comment') return postComment(card);
  if (b.dataset.act === 'answer') {
    const key = `i:${id}:${card.dataset.item}`;
    if (uploading(key)) return toast('이미지를 올리는 중입니다', true);
    const full = withAttachments(text, key);
    if (!full && !card.querySelector('.cmt')) return toast('답변이나 코멘트를 적어 주세요', true);
    const item = card.dataset.item ? Number(card.dataset.item) : undefined;
    act(id, 'answer', { text: full, item }, '답변을 보냈습니다').then(() => clearAttachments(key));
  }
  if (b.dataset.act === 'ack') act(id, 'ack', {}, '확인 처리했습니다');
  if (b.dataset.act === 'finish' || b.dataset.act === 'cancel') {
    const key = `i:${id}:`;
    if (uploading(key)) return toast('이미지를 올리는 중입니다', true);
    const full = withAttachments(text, key);
    if (b.dataset.act === 'cancel') {
      if (!full) return toast('할 수 없는 이유를 적어 주세요', true);
      return act(id, 'cancel', { reason: full }, '취소했습니다').then(() => clearAttachments(key));
    }
    if (!full && !card.querySelector('.cmt')) return toast('한 일이나 결과를 적어 주세요', true);
    act(id, 'finish', { text: full }, '완료 보고했습니다').then(() => clearAttachments(key));
  }
});

/* ---------- task detail ---------- */
/* History entries of one task: [{at, actor, event, body, task}] */
function parseLog(log, task) {
  return log.trim().split(/\n(?=- \S+ \[)/).filter(Boolean).map((e) => {
    const m = /^- (\S+) \[([^\]]+)\] ([^:\n]+)(?::\s?)?([\s\S]*)$/.exec(e);
    if (!m) return { at: '', actor: '', event: '', body: e, task };
    return { at: m[1], actor: m[2], event: m[3], body: m[4].split('\n').map((l) => l.replace(/^ {2}/, '')).join('\n').trim(), task };
  });
}
// Engine bookkeeping (run started/ended, permission denials) is noise when reading what people did.
const ENGINE_ACTORS = new Set(['engine', 'system']);
function renderLog(d, withTree, hideEngine) {
  const own = { id: d.task.id, title: d.task.title };
  let list = parseLog(d.log, own);
  if (withTree) for (const c of d.tree) list.push(...parseLog(c.log, c));
  if (hideEngine) list = list.filter((e) => !ENGINE_ACTORS.has(e.actor));
  list.sort((a, b) => b.at.localeCompare(a.at));
  if (!list.length) return '<div class="empty">기록 없음</div>';
  return list.map((e) => {
    const where = e.task.id !== own.id ? `<a href="#" class="id" data-open="${e.task.id}">${e.task.id}</a> <span class="who">${esc(e.task.title)}</span> · ` : '';
    const long = e.body.length > 700 || e.body.split('\n').length > 12;
    const body = e.body ? `<div class="prose${long ? ' clamp' : ''}">${md(tidy(e.body))}</div>${long ? '<button class="btn small more">더 보기</button>' : ''}` : '';
    const kind = e.actor === state.owner ? ' by-owner' : ENGINE_ACTORS.has(e.actor) ? ' by-engine' : '';
    return `<div class="entry${kind}"><div class="h">${where}${e.at ? new Date(e.at).toLocaleString() : ''} · <b>${esc(e.actor === state.owner ? '나' : e.actor)}</b> · ${esc(e.event)}</div>${body}</div>`;
  }).join('');
}

// A task's whole comment history: settled rounds stay, with a divider where each was settled or reopened.
function threadHistory(entries) {
  if (!entries.length) return '<div class="empty">코멘트가 없습니다</div>';
  const when = (iso) => new Date(iso).toLocaleString([], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `<div class="thread">${entries.map((e) => {
    const who = e.from === state.owner ? '나' : esc(e.from);
    if (e.event) return `<div class="mark">${e.event === 'reopened' ? '↩︎' : '✔︎'} ${who} · ${esc(e.text)}${e.item ? ` (${e.item}번)` : ''} · ${when(e.at)}</div>`;
    return `<div class="cmt${e.from === state.owner ? ' me' : ''}"><div class="h"><b>${who}</b> · ${when(e.at)}${e.item ? ` · ${e.item}번 질문` : ''}</div><div class="prose">${md(tidy(e.text))}</div></div>`;
  }).join('')}</div>`;
}

// Back button inside the dialog: where we came from when following a link to another task.
let dlgTrail = [];
async function openTask(id, from) {
  let d;
  try { d = await api(`/api/task/${id}`); } catch (e) { return toast(e.message, true); }
  if (!dlg.open) dlgTrail = [];
  if (from && from !== id) dlgTrail.push(from);
  const t = d.task;
  const back = dlgTrail.at(-1);
  $('#dlgTitle').innerHTML = `${back ? `<button class="btn small" id="dlgBack" title="${back} 로 돌아가기">← ${back}</button> ` : ''}<span class="id">${t.id}</span> ${esc(t.title)}`;
  if (back) $('#dlgBack').onclick = () => { dlgTrail.pop(); openTask(back); };
  const prefs = (() => { try { return JSON.parse(localStorage.getItem('bf-log') ?? '{}'); } catch { return {}; } })();
  const withTree = d.tree.length > 0 && prefs.tree !== false, hideEngine = prefs.engine !== true;
  const open = !terminal(t.status);
  $('#dlgBody').innerHTML = `

/* ---------- live feed ---------- */
const feed = $('#feed');
function addFeed(line) {
  const near = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  const m = /^\[([^\]]+)\]\s(.*)$/.exec(line);
  // Older logs may hold multi-line entries: fold continuation lines into the previous row.
  if (!m && feed.lastElementChild) {
    const prev = feed.lastElementChild.querySelector('.msg');
    if (prev) prev.insertAdjacentText('beforeend', ' ' + line.trim());
    return;
  }
  const time = m ? (/(\d{1,2}:\d{2}):\d{2}\s*$/.exec(m[1])?.[1] ?? '') : '';
  let text = (m ? m[2] : line).trim();
  let kind = '', html;
  const a = /^(T\d{4}) (\S+) ▸ (.*)$/.exec(text);
  if (a) {
    kind = 'act';
    const body = a[3].replace(/^💬\s*/, '💬 ');
    html = `<span class="tid" data-open="${a[1]}">${a[1]}</span><span class="who">${esc(a[2])}</span>${esc(body)}`;
  } else {
    kind = /실행 시작|검수 시작/.test(text) ? 'start' : /^!!!|정지|오류|→ 실패/.test(text) ? 'alert' : /^알림:|→ 완료|검수 → 완료|^웹:/.test(text) ? 'note' : '';
    html = esc(text).replace(/\b(T\d{4})\b/, '<span class="tid" data-open="$1">$1</span>');
  }
  const div = document.createElement('div');
  div.className = `row ${kind}`;
  div.innerHTML = `<span class="t">${esc(time)}</span><span class="msg">${html}</span>`;
  feed.appendChild(div);
  while (feed.childElementCount > 500) feed.firstChild.remove();
  if (near) feed.scrollTop = feed.scrollHeight;
}
feed.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-open]'); if (el) return openTask(el.dataset.open);
  const row = ev.target.closest('.row'); if (row) row.classList.toggle('open');
});

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('log', (e) => {
    const line = JSON.parse(e.data);
    addFeed(line);
    // Keep the office monitors in step with what employees are doing.
    if (line.includes(' ▸ ') || line.includes('💬')) {
      clearTimeout(connect.t);
      connect.t = setTimeout(() => { refresh(); if (!$('#viewChat').hidden && currentConv) openConv(currentConv, true); }, 700);
    }
  });
  es.addEventListener('changed', () => refresh());
  es.addEventListener('chat', () => { if (!$('#viewChat').hidden) { loadChatList(); if (currentConv) openConv(currentConv, true); } });
  es.onopen = () => ($('#feedState').textContent = '● 연결됨');
  es.onerror = () => { $('#feedState').textContent = '재연결 중…'; };
}

let chat = { convs: [], agents: [] }, currentConv = null, convData = null;
const icon = (name) => name === 'owner' ? ['🙂', '#e9ecef'] : avatarOf(name);
const whoName = (n) => n === 'owner' ? '나 (사용자)' : n;

async function loadChat() {
  try { chat = await api('/api/chat'); } catch (e) { return toast(e.message, true); }

  if (currentConv) openConv(currentConv, true);
}

function renderConvList() {
  const live = new Set((state?.engine?.active ?? []).filter((r) => r.kind === 'chat').map((r) => r.taskId));
  const item = (c, ic, bg, title) => `<div class="conv-item${c && c.id === currentConv ? ' on' : ''}" data-conv="${c ? c.id : ''}" ${!c ? `data-dm="${esc(title)}"` : ''}>
      <div class="ic" style="background:${bg}">${ic}</div>
      <div style="min-width:0;flex:1"><div class="t">${esc(c?.kind === 'dm' ? title : c?.title ?? title)}</div>
      <div class="p">${c?.last ? esc(`${whoName(c.last.from)}: ${c.last.text.replace(/[#*`>|]+/g, '').replace(/\s+/g, ' ').trim()}`) : c?.kind === 'meeting' ? '' : '대화를 시작해 보세요'}</div></div>
      ${c && live.has(c.id) ? '<span class="live-dot" title="발언 중"></span>' : ''}</div>`;
  const channels = chat.convs.filter((c) => c.kind === 'channel').sort((a, b) => a.title.localeCompare(b.title));
  const meetings = chat.convs.filter((c) => c.kind === 'meeting');
  const dms = chat.agents.map((a) => {
    const c = chat.convs.find((x) => x.kind === 'dm' && x.members.includes('owner') && x.members.includes(a));
    const [e, bg] = avatarOf(a);
    return item(c, e, bg, a);
  });
  const agentDms = chat.convs.filter((c) => c.kind === 'dm' && !c.members.includes('owner'));
  $('#convList').innerHTML =
    `<div class="group-h">채널 <button class="btn small" id="newChannel">+ 새 채널</button></div>` + channels.map((c) => item(c, '#', 'var(--bg)')).join('') +
    `<div class="group-h">회의</div>` + (meetings.length ? meetings.map((c) => item(c, c.status === 'closed' ? '✅' : '🗣', c.status === 'closed' ? 'var(--ok-soft)' : '#ebe8ff')).join('') : '<div class="hint" style="padding:0 10px 6px">아직 없습니다</div>') +
    `<div class="group-h">DM</div>` + dms.join('') +
    (agentDms.length ? `<div class="group-h">직원끼리 DM</div>` + agentDms.map((c) => item(c, '👥', 'var(--bg)', c.title)).join('') : '');

    if (!name) return;
    try { const r = await api('/api/chat/channel', { name }); await loadChat(); openConv(r.id); } catch (e) { toast(e.message, true); }
  };
}

async function openConv(id, keepScroll) {
  try { convData = await api(`/api/chat/${id}`); } catch (e) { return toast(e.message, true); }
  const switching = currentConv !== id;
  currentConv = id;
  document.querySelectorAll('.conv-item').forEach((x) => x.classList.toggle('on', x.dataset.conv === id));
  const { conv, messages, speaking } = convData;
  const meeting = conv.kind === 'meeting';
  const agentsHere = meeting ? conv.members.filter((m) => m !== 'owner') : conv.kind === 'dm' ? conv.members.filter((m) => m !== 'owner') : [];
  const speakingSet = new Set(speaking.map((s) => s.agent));
  const chips = agentsHere.map((a) => {
    const [e, bg] = avatarOf(a);
    const next = meeting && conv.queue?.[0] === a && !speakingSet.has(a);
    return `<span class="person-chip${speakingSet.has(a) ? ' speaking' : ''}${next ? ' next' : ''}"><span class="mini" style="background:${bg}">${e}</span>${esc(a)}${speakingSet.has(a) ? ' · 발언 중' : ''}</span>`;
  }).join('');
  let actions = '';
  if (meeting && conv.status === 'open') actions = '<button class="btn small" id="mRound">🔁 토론 한 바퀴 더</button><button class="btn small danger" id="mEnd">회의 종료 · 회의록</button>';
  if (meeting && conv.status === 'closing') actions = '<span class="chip s-review">회의록 작성 중</span>';
  if (meeting && conv.status === 'closed') actions = '<span class="chip s-done">종료</span><button class="btn small primary" id="mGoal">할 일을 목표로 등록</button>';
  const title = conv.kind === 'dm' ? `${conv.members.filter((m) => m !== 'owner').join(', ')} 와(과)의 DM` : conv.title;
  let lastDay = '';
  const body = messages.map((m) => {
    const day = new Date(m.at).toLocaleDateString();
    const sep = day !== lastDay ? `<div class="day">${day}</div>` : '';
    lastDay = day;
    const [e, bg] = icon(m.from);
    return `${sep}<div class="cmsg ${m.kind}"><div class="avatar" style="background:${bg}">${e}</div><div style="min-width:0">
      <div><span class="who">${esc(whoName(m.from))}</span><span class="when">${new Date(m.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}${m.kind === 'summary' ? ' · 회의록' : ''}</span></div>
      <div class="body prose">${md(m.text)}</div></div></div>`;
  }).join('');
  const typing = speaking.length
    ? speaking.map((s) => `<b>${esc(s.agent)}</b> ${meeting ? '발언' : '답장'} 작성 중<span class="dots"></span>${s.activity ? ` <span style="color:var(--faint)">▸ ${esc(s.activity)}</span>` : ''}`).join('<br>')
    : meeting && conv.queue?.length ? `다음 발언: <b>${esc(conv.queue.join(' → '))}</b>${state?.engine?.running ? '' : ' (엔진이 켜지면 시작합니다)'}`
    : meeting && conv.status === 'open' ? '모두 발언했습니다. 의견을 더 주시거나, 한 바퀴 더 돌리거나, 회의를 마치세요.'
    : conv.kind === 'channel' ? '@이름 으로 부르면 그 직원이 답합니다. 예: @ceo 이번 주 진행 상황 알려줘' : '';
  const placeholder = meeting ? (conv.status === 'open' ? '회의에 의견을 남기세요. 특정 직원에게만 물으려면 @이름 (Enter 전송, Shift+Enter 줄바꿈)' : '끝난 회의입니다') : '메시지 (Enter 전송, Shift+Enter 줄바꿈)';
  const msgsEl = document.querySelector('#chatMain .msgs');
  const nearBottom = !msgsEl || msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 120;
  const draft = document.querySelector('#chatMain textarea')?.value ?? '';
  $('#chatMain').innerHTML = `
    <div class="chat-head"><h3>${esc(title)}</h3><div class="people">${chips}</div><span style="flex:1"></span>${actions}
      ${meeting ? `<div class="agenda">안건: ${esc(conv.agenda)} · 진행 ${esc(conv.facilitator)}</div>` : ''}</div>
    <div class="msgs">${body || '<div class="chat-empty">아직 메시지가 없습니다</div>'}</div>
    <div class="typing">${typing}</div>
    <div class="chat-compose">${meeting && conv.status !== 'open' ? '' : attachUI(`c:${id}`)}<textarea placeholder="${esc(placeholder)}" ${meeting && conv.status !== 'open' ? 'disabled' : ''}></textarea>
      <button class="btn primary" id="sendBtn" ${meeting && conv.status !== 'open' ? 'disabled' : ''}>보내기</button></div>`;
  const ta = document.querySelector('#chatMain textarea');
  if (!switching) ta.value = draft;
  const box = document.querySelector('#chatMain .msgs');
  if (switching || nearBottom || !keepScroll) box.scrollTop = box.scrollHeight;
  const send = async () => {
    if (uploading(`c:${id}`)) return toast('이미지를 올리는 중입니다', true);
    const text = withAttachments(ta.value.trim(), `c:${id}`); if (!text) return;
    try { await api(`/api/chat/${id}/post`, { text }); ta.value = ''; clearAttachments(`c:${id}`); await openConv(id); loadChatList(); } catch (e) { toast(e.message, true); }
  };
  $('#sendBtn').onclick = send;
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  if ($('#mRound')) $('#mRound').onclick = async () => { try { await api(`/api/meeting/${id}/round`, {}); toast('한 바퀴 더 돌립니다'); openConv(id); } catch (e) { toast(e.message, true); } };
  if ($('#mEnd')) $('#mEnd').onclick = async () => { if (!confirm('회의를 마치고 회의록을 작성할까요?')) return; try { await api(`/api/meeting/${id}/end`, {}); toast('진행자가 회의록을 작성합니다'); openConv(id); } catch (e) { toast(e.message, true); } };
  if ($('#mGoal')) $('#mGoal').onclick = () => {
    const summary = [...messages].reverse().find((m) => m.kind === 'summary')?.text ?? '';
    const todo = /##\s*할 일([\s\S]*?)(\n##\s|$)/.exec(summary)?.[1]?.trim() ?? summary;
    showView('dash');
    $('#goalText').value = `회의 "${conv.title}"에서 정한 할 일을 진행하라.\n\n${todo}`;
    $('#goalText').focus();
    toast('목표 입력창에 할 일을 옮겼습니다. 확인 후 등록하세요');
  };
}

async function loadChatList() {
  try { chat = await api('/api/chat'); renderConvList(); } catch {}
}

$('#meetBtn').onclick = () => {
  $('#meetPeople').innerHTML = chat.agents.map((a) => {
    const [e, bg] = avatarOf(a);
    return `<label><input type="checkbox" value="${esc(a)}" ${a === 'ceo' ? 'checked' : ''}><span class="mini avatar" style="width:30px;height:30px;font-size:16px;background:${bg}">${e}</span><b>${esc(a)}</b></label>`;
  }).join('');
  meetDlg.showModal();
};
$('#meetStart').onclick = async () => {
  const participants = [...document.querySelectorAll('#meetPeople input:checked')].map((i) => i.value);
  try {
    const r = await api('/api/meeting', { title: $('#meetTitle').value, agenda: $('#meetAgenda').value, participants });
    meetDlg.close(); $('#meetTitle').value = ''; $('#meetAgenda').value = '';
    await loadChat(); openConv(r.id);
    toast('회의를 시작했습니다. 참석자들이 차례로 발언합니다');
  } catch (e) { toast(e.message, true); }
};

refresh(); connect();
try { const v = localStorage.getItem('bf-view'); if (v === 'chat' || v === 'staff') showView(v); } catch {}
setInterval(refresh, 5000);
</script>
</body>
</html>
