<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BusinessFactory</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #f3f4f7; --panel: #ffffff; --line: #e1e4ea; --line-strong: #cfd4dd;
  --text: #161b26; --muted: #454e5f; --faint: #6b7487;
  --accent: #3451d1; --accent-soft: #e8ecff;
  --ok: #23863a; --ok-soft: #e3f4e7; --warn: #b8650a; --warn-soft: #fff1dc;
  --bad: #c92a2a; --bad-soft: #ffe6e6; --info: #1864ab; --info-soft: #e2f0fd; --idle: #5c6575; --idle-soft: #eceef2;
  --floor: #ece6dc; --desk: #c99e6e; --desk-top: #d9b38a; --screen-off: #3a3f4a; --screen-on: #0f2a1d;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 6px rgba(16,24,40,.06);
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  --sans: "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111419; --panel: #191d24; --line: #2b313c; --line-strong: #3a4250;
    --text: #eef1f6; --muted: #c3cad6; --faint: #98a1b2;
    --accent: #8da2ff; --accent-soft: #252e4d;
    --ok: #63d47a; --ok-soft: #1b3424; --warn: #ffb35c; --warn-soft: #3b2b14;
    --bad: #ff7b7b; --bad-soft: #3f1e20; --info: #6cb8ff; --info-soft: #172d44; --idle: #aab2bf; --idle-soft: #272c35;
    --floor: #23211e; --desk: #6e5238; --desk-top: #85644a; --screen-off: #2a2e36; --screen-on: #0b2618;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.65 var(--sans); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ---------- header ---------- */
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 18px; padding: 12px 24px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -.3px; }
.brand small { color: var(--faint); font-weight: 500; font-size: 14px; margin-left: 6px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.ok::before { animation: pulse 1.6s infinite; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--idle-soft); color: var(--idle); }
@keyframes pulse { 50% { opacity: .35; } }
.meters { display: flex; gap: 22px; margin-left: auto; flex-wrap: wrap; }
.meter { min-width: 210px; font-size: 14px; color: var(--muted); }
.meter .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.meter b { color: var(--text); font-size: 15px; }
.meter small { color: var(--faint); font-size: 12.5px; }
.meter .bar { height: 7px; border-radius: 4px; background: var(--idle-soft); overflow: hidden; margin-top: 4px; }
.meter .bar i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.meter.mid .bar i { background: var(--warn); } .meter.high .bar i { background: var(--bad); }

main { padding: 20px 24px 48px; max-width: 1760px; margin: 0 auto; }
.composer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 20px; }
.composer textarea { width: 100%; min-height: 52px; resize: vertical; border: none; outline: none; background: transparent; font-size: 16px; line-height: 1.6; }
.composer textarea::placeholder { color: var(--faint); }
.composer .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; }
.composer label { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; font-weight: 600; }
.composer select, .composer input { border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; background: var(--bg); font-size: 14px; }
.hint { color: var(--faint); font-size: 13px; }

/* ---------- panels ---------- */
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.panel > h2 { margin: 0; font-size: 16px; font-weight: 800; padding: 13px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; letter-spacing: -.2px; }
.panel > h2 .count { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 9px; font-size: 13px; line-height: 22px; }
.panel > h2 .spacer { flex: 1; }
.panel > h2 .sub { color: var(--faint); font-weight: 500; font-size: 13.5px; }
.panel-body { padding: 16px 18px; }
.empty { color: var(--faint); text-align: center; padding: 24px 0; font-size: 15px; }
.stack > * + * { margin-top: 14px; }

.grid { display: grid; grid-template-columns: minmax(340px, 1fr) minmax(420px, 1.35fr) minmax(360px, 1.1fr); gap: 20px; align-items: start; margin-top: 20px; }
@media (max-width: 1280px) { .grid { grid-template-columns: 1fr 1fr; } .feed-col { grid-column: 1 / -1; } }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } header, main { padding-left: 14px; padding-right: 14px; } .meters { margin-left: 0; } }

/* ---------- office ---------- */
.office { background:
    linear-gradient(var(--floor), var(--floor)) padding-box;
  padding: 22px 20px 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 26px 20px; }
.desk { position: relative; cursor: default; }
.desk.clickable { cursor: pointer; }
.desk .screen { position: relative; margin: 0 auto; width: 88%; height: 112px; border-radius: 10px 10px 4px 4px; background: var(--screen-off);
  border: 6px solid #2b2f36; padding: 10px 12px; color: #9ff2bf; font: 13px/1.5 var(--sans); overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,.18); }
.desk.working .screen, .desk.reviewing .screen { background: var(--screen-on); }
.desk .screen .task { color: #fff; font-weight: 700; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.desk .screen .now { margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.desk .screen .off { color: #8b93a3; display: flex; height: 100%; align-items: center; justify-content: center; font-size: 15px; gap: 6px; }
.desk .screen .cursor { display: inline-block; width: 7px; height: 14px; background: #9ff2bf; vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.desk .stand { width: 26px; height: 12px; background: #2b2f36; margin: 0 auto; }
.desk .table { position: relative; height: 18px; border-radius: 6px; background: var(--desk-top); border-bottom: 8px solid var(--desk); box-shadow: 0 6px 10px rgba(0,0,0,.12); }
.desk .keyboard { position: absolute; left: 50%; top: 3px; transform: translateX(-50%); width: 70px; height: 9px; border-radius: 3px; background: #e9ebef; }
.desk.working .keyboard, .desk.reviewing .keyboard { animation: type .35s infinite alternate; }
@keyframes type { to { background: #cfd4dc; } }
.desk .mug { position: absolute; right: 16px; top: -12px; font-size: 18px; }
.desk .person { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 0 4px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; flex: none; border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--line-strong); }
.desk.working .avatar { box-shadow: 0 0 0 3px var(--ok); }
.desk.reviewing .avatar { box-shadow: 0 0 0 3px var(--accent); }
.person .name { font-weight: 800; font-size: 16px; line-height: 1.3; }
.person .role { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; padding: 0 4px; }
.badge { font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line-strong); color: var(--muted); }
.badge.live { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.badge.rev { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.badge.queue { background: var(--warn-soft); border-color: transparent; color: var(--warn); }

/* ---------- inbox cards ---------- */
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--panel); }
.card.approval { border-left: 4px solid var(--warn); } .card.question { border-left: 4px solid var(--info); } .card.finished { border-left: 4px solid var(--ok); }
.card .kind { font-size: 13px; font-weight: 800; }
.card.approval .kind { color: var(--warn); } .card.question .kind { color: var(--info); } .card.finished .kind { color: var(--ok); }
.card .kind span { color: var(--faint); font-weight: 600; }
.card .title { font-weight: 700; font-size: 16px; line-height: 1.5; margin: 4px 0 8px; }
.card .meta { color: var(--muted); font-size: 14px; }
.card .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.card textarea, .notebox { width: 100%; min-height: 70px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; background: var(--bg); resize: vertical; font-size: 14.5px; line-height: 1.6; margin-top: 10px; }
.grant { display: inline-block; font-family: var(--mono); font-size: 13px; background: var(--warn-soft); color: var(--warn); border-radius: 5px; padding: 2px 8px; margin: 3px 6px 3px 0; font-weight: 600; }
details.hire { margin-top: 10px; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px; }
details.hire summary { cursor: pointer; font-weight: 700; }

.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 7px 16px; cursor: pointer; font-weight: 700; font-size: 14.5px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.good { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 11px; font-size: 13.5px; }

.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.s-running { background: var(--info-soft); color: var(--info); }
.s-pending, .s-waiting { background: var(--idle-soft); color: var(--idle); }
.s-review { background: var(--accent-soft); color: var(--accent); }
.s-blocked { background: var(--warn-soft); color: var(--warn); }
.s-done { background: var(--ok-soft); color: var(--ok); }
.s-failed { background: var(--bad-soft); color: var(--bad); }
.s-canceled, .s-awaiting_approval { background: var(--idle-soft); color: var(--faint); }

/* ---------- board ---------- */
.goal { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.goal + .goal { margin-top: 14px; }
.goal-head { padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; }
.goal-head:hover, .trow:hover { background: var(--bg); }
.goal-head .title { font-weight: 700; font-size: 16px; line-height: 1.45; }
.goal-head > .chip, .trow > .chip { align-self: start; justify-self: end; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.tags span { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; }
.trow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; font-size: 15px; line-height: 1.5; }
.id { font-family: var(--mono); font-size: 12.5px; color: var(--faint); padding-top: 2px; }
.trow .who { color: var(--muted); font-size: 13.5px; }
.live { grid-column: 1 / -1; font-size: 13.5px; color: var(--info); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.live::before { content: "▶ "; font-size: 10px; vertical-align: 1px; }

/* ---------- feed ---------- */
.feed { font-size: 14px; line-height: 1.6; height: calc(100vh - 220px); min-height: 360px; overflow-y: auto; padding: 6px 0; }
.feed .row { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 5px 16px; }
.feed .row:hover { background: var(--bg); }
.feed .t { font-family: var(--mono); font-size: 12px; color: var(--faint); padding-top: 2px; }
.feed .msg { min-width: 0; }
.feed .who { font-weight: 700; color: var(--text); margin-right: 6px; }
.feed .act .msg { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.feed .act.open .msg { -webkit-line-clamp: unset; }
.feed .start { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 9px; }
.feed .start .msg { color: var(--accent); font-weight: 700; }
.feed .alert .msg { color: var(--bad); font-weight: 700; }
.feed .note .msg { color: var(--ok); font-weight: 600; }
.feed code { font-family: var(--mono); font-size: 12.5px; background: var(--bg); padding: 0 4px; border-radius: 4px; }
.tid { cursor: pointer; font-family: var(--mono); font-size: 12.5px; color: var(--accent); font-weight: 700; margin-right: 6px; }

.side-list { font-size: 14px; }
.side-list .item { padding: 7px 0; border-bottom: 1px solid var(--line); }
.side-list .item:last-child { border-bottom: none; }
.side-list b { font-weight: 700; }
.side-list .d { color: var(--muted); font-size: 13.5px; }
.side-h { margin: 18px 0 4px; font-size: 14px; color: var(--muted); font-weight: 800; }
.side-h:first-child { margin-top: 0; }

/* ---------- dialog ---------- */
dialog { border: none; border-radius: 14px; padding: 0; width: min(980px, 95vw); max-height: 92vh; background: var(--panel); color: var(--text); box-shadow: 0 24px 70px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,14,22,.55); }
.dlg-head { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.dlg-head h3 { margin: 0; font-size: 19px; line-height: 1.45; flex: 1; letter-spacing: -.2px; }
.dlg-body { padding: 16px 22px 24px; overflow-y: auto; max-height: calc(92vh - 70px); }
.dlg-body h4 { margin: 20px 0 8px; font-size: 14.5px; color: var(--muted); font-weight: 800; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 16px 0 14px; }
.tabs button { border: none; background: none; padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 700; font-size: 15px; }
.tabs button.on { color: var(--accent); border-color: var(--accent); }
.loglist .entry { padding: 10px 0; border-bottom: 1px solid var(--line); }
.loglist .entry .h { font-size: 13.5px; color: var(--muted); margin-bottom: 2px; }
.loglist .entry .h b { color: var(--text); }
.files { display: flex; gap: 8px; flex-wrap: wrap; }
.actfeed { font-size: 14px; }
.actfeed div { padding: 3px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }

.prose { font-size: 15.5px; line-height: 1.8; max-width: 78ch; }
.prose h1, .prose h2, .prose h3 { margin: 22px 0 8px; line-height: 1.4; letter-spacing: -.2px; }
.prose h1 { font-size: 21px; } .prose h2 { font-size: 18px; } .prose h3 { font-size: 16.5px; }
.prose p { margin: 8px 0; }
.prose code { font-family: var(--mono); font-size: 13.5px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.prose pre { background: var(--bg); padding: 12px 14px; border-radius: 8px; font: 13.5px/1.6 var(--mono); white-space: pre-wrap; }
.prose table { border-collapse: collapse; margin: 12px 0; font-size: 14.5px; display: block; overflow-x: auto; }
.prose th, .prose td { border: 1px solid var(--line-strong); padding: 7px 11px; text-align: left; vertical-align: top; }
.prose th { background: var(--bg); }
.prose blockquote { margin: 10px 0; padding: 4px 14px; border-left: 4px solid var(--line-strong); color: var(--muted); }
.prose ul, .prose ol { padding-left: 24px; margin: 8px 0; }
.prose li { margin: 3px 0; }
.card .prose { font-size: 15px; line-height: 1.7; }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
#toast.show { opacity: 1; } #toast.err { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<header>
  <div class="brand">BusinessFactory<small id="company"></small></div>
  <span id="engine" class="pill idle">확인 중</span>
  <div class="meters" id="meters"></div>
</header>

<main>
  <div class="composer">
    <textarea id="goalText" placeholder="회사에 시킬 일을 적으세요. 예) 돈 벌 수 있는 웹 서비스 아이디어 10개를 조사해서 순위를 매겨줘"></textarea>
    <div class="row">
      <label>작업 공간 <select id="goalWorkspace"><option value="">없음</option></select></label>
      <label>프로젝트 <input id="goalProject" list="projects" placeholder="선택 사항" size="12"></label>
      <datalist id="projects"></datalist>
      <span style="flex:1"></span>
      <span class="hint">Ctrl+Enter</span>
      <button class="btn primary" id="goalSubmit">목표 등록</button>
    </div>
  </div>

  <section class="panel">
    <h2>사무실 <span class="sub" id="officeSummary"></span></h2>
    <div class="office" id="office"></div>
  </section>

  <div class="grid">
    <div class="stack">
      <section class="panel">
        <h2>처리할 일 <span class="count" id="inboxCount" hidden></span></h2>
        <div class="panel-body stack" id="inbox"></div>
      </section>
      <section class="panel">
        <h2>회사</h2>
        <div class="panel-body">
          <div class="side-h">회사 기억</div><div class="side-list" id="memory"></div>
          <div class="side-h">최근 7일 실행</div><div class="side-list" id="runs"></div>
        </div>
      </section>
    </div>

    <section class="panel">
      <h2>업무 현황 <span class="spacer"></span>
        <label style="font-weight:600;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center"><input type="checkbox" id="showDone"> 끝난 목표도 보기</label>
      </h2>
      <div class="panel-body" id="board"></div>
    </section>

    <section class="panel feed-col">
      <h2>실시간 활동 <span class="spacer"></span><span id="feedState" class="sub"></span></h2>
      <div class="feed" id="feed"></div>
    </section>
  </div>
</main>

<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlgTitle"></h3><button class="btn small" onclick="dlg.close()">닫기</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>
<div id="toast"></div>

<script>
const TOKEN = '%%TOKEN%%';
let state = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const terminal = (s) => ['done', 'failed', 'canceled'].includes(s);
const ago = (iso) => {
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `${s}초` : s < 3600 ? `${Math.round(s / 60)}분` : `${Math.round(s / 3600)}시간`;
};

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.className = ''), 2800);
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-BF-Token': TOKEN }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청 실패');
  return data;
}

async function act(id, action, body, okMsg) {
  try { await api(`/api/task/${id}/${action}`, body); toast(okMsg); await refresh(); }
  catch (e) { toast(e.message, true); }
}

/* ---------- tiny markdown ---------- */
function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(src) {
  const lines = String(src ?? '').replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let b = ''; i++; while (i < lines.length && !/^```/.test(lines[i])) b += lines[i++] + '\n'; i++; out += `<pre>${esc(b)}</pre>`; continue; }
    const h = /^(#{1,4})\s+(.*)$/.exec(l); if (h) { const n = Math.min(h[1].length, 3); out += `<h${n}>${inlineMd(h[2])}</h${n}>`; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r));
      out += '<table>' + body.map((r, k) => '<tr>' + cells(r).map((c) => k === 0 ? `<th>${inlineMd(c)}</th>` : `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') + '</table>';
      continue;
    }
    if (/^>\s?/.test(l)) { const b = []; while (i < lines.length && /^>\s?/.test(lines[i])) b.push(lines[i++].replace(/^>\s?/, '')); out += `<blockquote>${inlineMd(b.join(' '))}</blockquote>`; continue; }
    if (/^\s*[-*]\s+/.test(l)) { let b = ''; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) b += `<li>${inlineMd(lines[i++].replace(/^\s*[-*]\s+/, ''))}</li>`; out += `<ul>${b}</ul>`; continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { let b = ''; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) b += `<li>${inlineMd(lines[i++].replace(/^\s*\d+[.)]\s+/, ''))}</li>`; out += `<ol>${b}</ol>`; continue; }
    if (!l.trim()) { i++; continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\||>|\s*[-*]\s|\s*\d+[.)]\s)/.test(lines[i])) p.push(lines[i++]);
    out += `<p>${p.map(inlineMd).join('<br>')}</p>`;
  }
  return out;
}

const AVATARS = { ceo: ['👔', '#ffe8cc'], hr: ['📁', '#e5dbff'], reviewer: ['🔍', '#d0ebff'], worker: ['🔧', '#d3f9d8'] };
const PALETTE = ['#ffe3e3', '#fff3bf', '#d3f9d8', '#d0ebff', '#e5dbff', '#ffdeeb', '#c3fae8', '#ffe8cc'];
// Single-codepoint emoji only: ZWJ sequences (🧑‍💻) split into two glyphs on some Windows setups.
const EMOJI = ['💼', '📊', '🧩', '📝', '🎯', '📦', '🧪', '🗃️'];
function avatarOf(name) {
  if (AVATARS[name]) return AVATARS[name];
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return [/dev|engineer|coder/.test(name) ? '💻' : /design/.test(name) ? '🎨' : /market/.test(name) ? '📣' : /writ|content/.test(name) ? '✍️' : /research|analy/.test(name) ? '📚' : EMOJI[h % EMOJI.length], PALETTE[h % PALETTE.length]];
}

  let d;
  try { d = await api(`/api/task/${id}`); } catch (e) { return toast(e.message, true); }
  const t = d.task;
  $('#dlgTitle').innerHTML = `<span class="id">${t.id}</span> ${esc(t.title)}`;
  const entries = d.log.trim().split(/\n(?=- \S+ \[)/).filter(Boolean).reverse().map((e) => {
    const m = /^- (\S+) \[([^\]]+)\] ([^:\n]+)(?::\s?)?([\s\S]*)$/.exec(e);
    if (!m) return `<div class="entry">${esc(e)}</div>`;
    const body = m[4].split('\n').map((l) => l.replace(/^ {2}/, '')).join('\n').trim();
    return `<div class="entry"><div class="h">${new Date(m[1]).toLocaleString()} · <b>${esc(m[2])}</b> · ${esc(m[3])}</div>${body ? `<div class="prose">${md(body)}</div>` : ''}</div>`;

      ${t.project ? `<span>프로젝트 ${esc(t.project)}</span>` : ''}${t.workspace ? `<span>작업 공간 ${esc(t.workspace)}</span>` : ''}

    <div class="tabs"><button data-tab="brief" class="on">지시서</button><button data-tab="out">결과물 (${d.outputs.length})</button><button data-tab="log">이력</button><button data-tab="act">활동</button></div>
    <div data-pane="brief" class="prose">${md(d.body)}</div>
    <div data-pane="out" hidden>${d.outputs.length ? `<div class="files">${d.outputs.map((o) => `<button class="btn small" data-file="${esc(o.path)}">${esc(o.path)} <span style="color:var(--faint);font-weight:500">${(o.size / 1024).toFixed(1)}KB</span></button>`).join('')}</div><div id="fileView" class="prose" style="margin-top:16px"></div>` : '<div class="empty">아직 결과물이 없습니다</div>'}</div>
    <div data-pane="log" hidden class="loglist">${entries}</div>
    <div data-pane="act" hidden class="actfeed">${d.activity.length ? d.activity.map((l) => {
      const m = /^(\S+) \[([^\]]+)\] (.*)$/.exec(l);
      return m ? `<div><span class="id">${new Date(m[1]).toLocaleTimeString()}</span> <b style="color:var(--text)">${esc(m[2])}</b> ${esc(m[3])}</div>` : `<div>${esc(l)}</div>`;
    }).join('') : '<div class="empty">기록 없음</div>'}</div>
    <h4>사용자 메모 · 조치</h4>
    <textarea id="dlgNote" class="notebox" placeholder="코멘트나 취소 사유"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" id="dlgComment">코멘트 남기기</button>
      ${open ? '<button class="btn danger" id="dlgCancel">이 업무 취소</button>' : ''}
    </div>`;

    body.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));

  });
  body.querySelectorAll('[data-file]').forEach((b) => b.onclick = async () => {
    try {
      const f = await api(`/api/task/${id}/file?path=${encodeURIComponent(b.dataset.file)}`);
      $('#fileView').innerHTML = /\.(md|txt)$/i.test(b.dataset.file) ? md(f.text) : `<pre>${esc(f.text)}</pre>`;
    } catch (e) { toast(e.message, true); }

  }
}

/* ---------- live feed ---------- */
const feed = $('#feed');
function addFeed(line) {
  const near = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  const m = /^\[([^\]]+)\]\s(.*)$/.exec(line);
  const time = m ? (/(\d{1,2}:\d{2}):\d{2}\s*$/.exec(m[1])?.[1] ?? '') : '';
  let text = (m ? m[2] : line).trim();
  let kind = '', html;
  const a = /^(T\d{4}) (\S+) ▸ (.*)$/.exec(text);
  if (a) {
    kind = 'act';
    const body = a[3].replace(/^💬\s*/, '💬 ');
    html = `<span class="tid" data-open="${a[1]}">${a[1]}</span><span class="who">${esc(a[2])}</span>${esc(body)}`;
  } else {
    kind = /실행 시작|검수 시작/.test(text) ? 'start' : /^!!!|정지|오류|→ 실패/.test(text) ? 'alert' : /^알림:|→ 완료|검수 → 완료|^웹:/.test(text) ? 'note' : '';
    html = esc(text).replace(/\b(T\d{4})\b/, '<span class="tid" data-open="$1">$1</span>');
  }
  const div = document.createElement('div');
  div.className = `row ${kind}`;
  div.innerHTML = `<span class="t">${esc(time)}</span><span class="msg">${html}</span>`;
  feed.appendChild(div);
  while (feed.childElementCount > 500) feed.firstChild.remove();
  if (near) feed.scrollTop = feed.scrollHeight;
}
feed.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-open]'); if (el) return openTask(el.dataset.open);
  const row = ev.target.closest('.row.act'); if (row) row.classList.toggle('open');
});

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('log', (e) => {
    const line = JSON.parse(e.data);
    addFeed(line);
    // Keep the office monitors in step with what employees are doing.
    if (line.includes(' ▸ ')) { clearTimeout(connect.t); connect.t = setTimeout(refresh, 700); }
  });
  es.addEventListener('changed', () => refresh());
  es.onopen = () => ($('#feedState').textContent = '● 연결됨');
  es.onerror = () => { $('#feedState').textContent = '재연결 중…'; };
}

async function refresh() {
  try {
    state = await api('/api/state');
    renderHeader(); renderOffice(); renderInbox(); renderBoard(); renderSide();
    const pending = state.inbox.approvals.length + state.inbox.questions.length;
    document.title = (pending ? `(${pending}) ` : '') + 'BusinessFactory';
  } catch (e) { $('#engine').className = 'pill bad'; $('#engine').textContent = '서버 연결 끊김'; }
}

refresh(); connect();
setInterval(refresh, 5000);
</script>
